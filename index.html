  const combined = (p.name + ' ' + p.provider).toLowerCase().replace(/\s+/g,'');
  const combinedSpaced = (p.name + ' ' + p.provider).toLowerCase();
  for (const rule of MATCH_RULES) {
    for (const term of rule.terms) {
      const t = term.replace(/\s+/g,'');
      if (combined.includes(t) || combinedSpaced.includes(term)) {
        return rule;
      }
    }
  }
  return { status:'not-contacted', label:'⬜ Not Contacted', date:'', note:'' };
}

function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' }); }
  catch { return iso || '—'; }
}

// ── Tab 1 renderer ────────────────────────────────────────────────────────────
function renderOverview({ responded, awaiting, not_sent, followup_sent }) {
  followup_sent = followup_sent || [];
  const overdue = awaiting.filter(p => p.days_waiting >= 5);
  let html = `<div class="stats-row" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card"><div class="stat-icon red">📬</div>
      <div><div class="stat-number" style="color:#d93025">${responded.length}</div>
      <div class="stat-label">Responded</div></div></div>
    <div class="stat-card"><div class="stat-icon yellow">⏳</div>
      <div><div class="stat-number" style="color:#b06000">${awaiting.length}</div>
      <div class="stat-label">Awaiting Response${overdue.length ? ` <span style="color:#d93025">(${overdue.length} overdue)</span>`:''}</div></div></div>
    <div class="stat-card"><div class="stat-icon" style="background:#f3eaff">📨</div>
      <div><div class="stat-number" style="color:#6320b0">${followup_sent.length}</div>
      <div class="stat-label">Follow-up Sent</div></div></div>
    <div class="stat-card"><div class="stat-icon blue">📋</div>
      <div><div class="stat-number" style="color:#0055cc">${not_sent.length}</div>
      <div class="stat-label">Not Yet Contacted</div></div></div>
  </div>`;

  if (responded.length) {
    html += `<div class="section"><div class="section-header"><span>📬</span>
      <span class="section-title">Responded</span>
      <span class="badge red">${responded.length}</span></div>
      <table><thead><tr>
        <th style="width:24%">Provider</th><th style="width:14%">Date</th><th>Outcome / Notes</th>
      </tr></thead><tbody>`;
    for (const p of responded) {
      html += `<tr><td><span class="provider-name">${p.name}</span></td>
        <td>${fmtDate(p.date_responded)}</td>
        <td><span class="response-text">${p.response}</span></td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  if (followup_sent.length) {
    html += `<div class="section"><div class="section-header"><span>📨</span>
      <span class="section-title">Follow-up Sent — Awaiting Response</span>
      <span class="badge" style="background:#f0e6ff;color:#6320b0">${followup_sent.length}</span></div>
      <table><thead><tr>
        <th style="width:28%">Provider</th><th style="width:16%">Follow-up Sent</th><th style="width:18%">Initial Contact</th><th>Contact</th>
      </tr></thead><tbody>`;
    for (const p of followup_sent) {
      html += `<tr><td><span class="provider-name">${p.name}</span></td>
        <td>${fmtDate(p.date_sent)}</td>
        <td>${p.initial_contact}</td>
        <td><span class="response-text">${p.contact}</span></td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  if (awaiting.length) {
    html += `<div class="section"><div class="section-header"><span>⏳</span>
      <span class="section-title">Awaiting Response</span>
      <span class="badge yellow">${awaiting.length}</span></div>
      <table><thead><tr>
        <th style="width:24%">Provider</th><th style="width:18%">Contacted</th><th>Status</th>
      </tr></thead><tbody>`;
    for (const p of awaiting) {
      const od = p.days_waiting >= 5;
      html += `<tr><td><span class="provider-name">${p.name}</span></td>
        <td>${fmtDate(p.date_sent)}</td>
        <td><span class="pill ${od?'pill-no-capacity':'pill-awaiting'}">${od?'⚠️ Overdue':'Waiting'}</span>
        <div class="days-chip ${od?'overdue':''}">${p.days_waiting}d ago</div></td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  if (not_sent.length) {
    html += `<div class="section"><div class="section-header"><span>📋</span>
      <span class="section-title">Not Yet Contacted — Drafts Pending</span>
      <span class="badge blue">${not_sent.length}</span></div>
      <table><thead><tr>
        <th style="width:40%">Provider</th><th>Action Required</th>
      </tr></thead><tbody>`;
    for (const p of not_sent) {
      html += `<tr><td><span class="provider-name">${p.name}</span></td>
        <td>Call <a class="phone-link" href="tel:${p.phone.replace(/\s/g,'')}">${p.phone}</a> for intake email, then send draft</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }
  document.getElementById('root').innerHTML = html;
}

// ── Tab 2 renderer ────────────────────────────────────────────────────────────
let currentFilter = 'all';
let currentSearch = '';
let currentSort   = { col: 'lga', dir: 1 };
let enrichedProviders = [];

function enrichProviders() {
  enrichedProviders = PROVIDERS.map(p => {
    const s = getProviderStatus(p);
    return { ...p, status: s.status, statusLabel: s.label, date: s.date, note: s.note };
  });
}

function renderList() {
  const container = document.getElementById('listRoot');

  let rows = [...enrichedProviders];

  if (currentFilter !== 'all') rows = rows.filter(r => r.status === currentFilter);

  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    rows = rows.filter(r =>
      r.name.toLowerCase().includes(q) ||
      r.provider.toLowerCase().includes(q) ||
      r.suburb.toLowerCase().includes(q) ||
      r.lga.toLowerCase().includes(q)
    );
  }

  rows.sort((a, b) => {
    const av = (a[currentSort.col] || '').toLowerCase();
    const bv = (b[currentSort.col] || '').toLowerCase();
    return av < bv ? -currentSort.dir : av > bv ? currentSort.dir : 0;
  });

  const counts = {};
  enrichedProviders.forEach(r => { counts[r.status] = (counts[r.status]||0)+1; });
  const contacted = enrichedProviders.filter(r => r.date).length;

  const filterDefs = [
    { key:'all',           label:'All',              count: enrichedProviders.length },
    { key:'not-contacted',  label:'Not Contacted',    count: counts['not-contacted']||0 },
    { key:'awaiting',       label:'Awaiting Reply',   count: counts['awaiting']||0 },
    { key:'need-call',      label:'Need to Call',     count: counts['need-call']||0 },
    { key:'bounced',        label:'Bounced',          count: counts['bounced']||0 },
    { key:'not-chsp',       label:'Not CHSP',         count: counts['not-chsp']||0 },
    { key:'no-capacity',    label:'No Capacity',      count: counts['no-capacity']||0 },
    { key:'followup-sent',  label:'Follow-up Sent',   count: counts['followup-sent']||0 },
    { key:'has-capacity',   label:'Has Capacity ✅',  count: counts['has-capacity']||0 },
  ];

  const chips = filterDefs.map(f =>
    `<button class="chip${currentFilter===f.key?' active':''}" onclick="setFilter('${f.key}')">${f.label} <b>${f.count}</b></button>`
  ).join('');

  const sortArrow = (col) => {
    if (currentSort.col !== col) return '<span class="sort-arrow">↕</span>';
    return `<span class="sort-arrow">${currentSort.dir===1?'↑':'↓'}</span>`;
  };

  let tableRows = '';
  if (rows.length === 0) {
    tableRows = `<tr><td colspan="6"><div class="empty-msg">No providers match this filter.</div></td></tr>`;
  } else {
    rows.forEach((r, i) => {
      tableRows += `<tr>
        <td style="color:#aaa;font-size:11px;width:36px">${i+1}</td>
        <td>
          <div class="provider-name">${r.name}</div>
          <div class="provider-sub">${r.provider}</div>
        </td>
        <td>
          <div>${r.suburb}</div>
          <div class="provider-sub">${r.lga} · ${r.postcode}</div>
        </td>
        <td><span class="pill ${PILL_CLASS[r.status]||'pill-not-contacted'}">${r.statusLabel}</span></td>
        <td style="font-size:12px;color:#6e6e73">${r.date||'—'}</td>
        <td style="font-size:12px;color:#3a3a3c;max-width:260px">${r.note||''}</td>
      </tr>`;
    });
  }

  container.innerHTML = `
    <div class="list-toolbar">
      <input class="search-input" type="text" placeholder="Search name, provider, suburb…"
        value="${currentSearch}" oninput="setSearch(this.value)">
      <div class="filter-chips">${chips}</div>
    </div>
    <div style="font-size:12px;color:#6e6e73;margin-bottom:12px">
      Showing <b>${rows.length}</b> of ${enrichedProviders.length} providers &nbsp;·&nbsp;
      <b>${contacted}</b> contacted &nbsp;·&nbsp;
      <b>${enrichedProviders.length - contacted}</b> not yet contacted
    </div>
    <div class="section">
      <table>
        <thead><tr>
          <th style="width:36px">#</th>
          <th onclick="setSort('name')" class="${currentSort.col==='name'?'sorted':''}">Service / Provider ${sortArrow('name')}</th>
          <th onclick="setSort('suburb')" class="${currentSort.col==='suburb'?'sorted':''}">Suburb / LGA ${sortArrow('suburb')}</th>
          <th onclick="setSort('status')" class="${currentSort.col==='status'?'sorted':''}">Status ${sortArrow('status')}</th>
          <th onclick="setSort('date')" class="${currentSort.col==='date'?'sorted':''}">Date Contacted ${sortArrow('date')}</th>
          <th>Notes</th>
        </tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>`;
}

function setFilter(f) { currentFilter = f; renderList(); }
function setSearch(v) { currentSearch = v; renderList(); }
function setSort(col) {
  if (currentSort.col === col) currentSort.dir *= -1;
  else { currentSort.col = col; currentSort.dir = 1; }
  renderList();
}

// ── Tab switching ─────────────────────────────────────────────────────────────
let activeTab = 1;
function showTab(n) {
  activeTab = n;
  document.getElementById('tab1').style.display = n===1 ? '' : 'none';
  document.getElementById('tab2').style.display = n===2 ? '' : 'none';
  document.getElementById('tabBtn1').className = 'tab-btn' + (n===1?' active':'');
  document.getElementById('tabBtn2').className = 'tab-btn' + (n===2?' active':'');
  if (n===2 && enrichedProviders.length > 0) renderList();
}
